# ALSA Configuration for Production Audio System
# Optimized for low-latency professional audio processing

# Default PCM device
pcm.!default {
    type pulse
    server unix:/run/user/1000/pulse/native
}

# Control device
ctl.!default {
    type pulse
    server unix:/run/user/1000/pulse/native
}

# Low-latency PCM device for production audio
pcm.production {
    type hw
    card 0
    device 0
    format S24_3LE
    rate 48000
    channels 2
    period_size 256
    buffer_size 1024
}

# Multi-channel capture device
pcm.multichannel {
    type hw
    card 0
    device 0
    format S24_3LE
    rate 48000
    channels 8
    period_size 256
    buffer_size 1024
}

# Professional audio interface (USB Audio Class 2.0)
pcm.professional {
    type hw
    card 1
    device 0
    format S32_LE
    rate 96000
    channels 8
    period_size 128
    buffer_size 512
}

# Loopback device for testing
pcm.loopback {
    type hw
    card Loopback
    device 0
    subdevice 0
}

# JACK integration
pcm.jack {
    type jack
    playback_ports {
        0 system:playback_1
        1 system:playback_2
    }
    capture_ports {
        0 system:capture_1
        1 system:capture_2
    }
}

# Null device for testing
pcm.null {
    type null
}

# Rate conversion with high quality
pcm.rate_convert {
    type rate
    slave {
        pcm "hw:0,0"
        rate 48000
        format S24_3LE
    }
    converter "samplerate_best"
}

# Mixer configuration
ctl.mixer0 {
    type hw
    card 0
}

# DMIX for multiple applications (if needed)
pcm.dmix_48000 {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 256
        buffer_size 1024
        rate 48000
        format S24_3LE
        channels 2
    }
    bindings {
        0 0
        1 1
    }
}

# DSNOOP for multiple capture applications
pcm.dsnoop_48000 {
    type dsnoop
    ipc_key 2048
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 256
        buffer_size 1024
        rate 48000
        format S24_3LE
        channels 2
    }
    bindings {
        0 0
        1 1
    }
}