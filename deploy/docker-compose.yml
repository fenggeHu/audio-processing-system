version: '3.8'

services:
  # 音频处理系统主服务
  audio-processing:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: audio-processing-main
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - AUDIO_CONFIG_PATH=/app/config/audio_system.json
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://audiouser:audiopass@postgres:5432/audioprocessing
    volumes:
      - ../config:/app/config:ro
      - audio_logs:/app/logs
      - audio_recordings:/app/recordings
      - audio_plugins:/app/plugins
      - /dev/snd:/dev/snd:rw  # 音频设备访问
    devices:
      - /dev/snd:/dev/snd
    privileged: true  # 需要访问音频设备
    networks:
      - audio_network
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web控制界面
  audio-web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    container_name: audio-processing-web
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - AUDIO_API_URL=http://audio-processing:8000
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "8080:8000"
    volumes:
      - ../static:/app/static:ro
      - audio_logs:/app/logs
    networks:
      - audio_network
    depends_on:
      - audio-processing
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: audio-processing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - audio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: audio-processing-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=audioprocessing
      - POSTGRES_USER=audiouser
      - POSTGRES_PASSWORD=audiopass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - audio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiouser -d audioprocessing"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: audio-processing-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl:ro
    networks:
      - audio_network
    depends_on:
      - audio-web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: audio-processing-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - audio_network
    depends_on:
      - audio-processing

  # Grafana仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: audio-processing-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - audio_network
    depends_on:
      - prometheus

  # 日志收集器
  fluentd:
    build:
      context: ./logging
      dockerfile: Dockerfile.fluentd
    container_name: audio-processing-fluentd
    restart: unless-stopped
    volumes:
      - ./logging/fluent.conf:/fluentd/etc/fluent.conf:ro
      - audio_logs:/var/log/audio-processing:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - audio_network
    depends_on:
      - elasticsearch

  # Elasticsearch日志存储
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: audio-processing-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - audio_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana日志可视化
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: audio-processing-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - audio_network
    depends_on:
      - elasticsearch

networks:
  audio_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # 应用数据
  audio_logs:
    driver: local
  audio_recordings:
    driver: local
  audio_plugins:
    driver: local
  
  # 数据库
  postgres_data:
    driver: local
  redis_data:
    driver: local
  
  # 监控
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  
  # Web服务
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local