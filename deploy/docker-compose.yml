version: '3.8'

services:
  # 音频处理系统主服务
  audio-processing:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: audio-processing-main
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - AUDIO_CONFIG_PATH=/app/config/audio_system.json
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://audiouser:audiopass@postgres:5432/audioprocessing
    volumes:
      - ../config:/app/config:ro
      - audio_logs:/app/logs
      - audio_recordings:/app/recordings
      - audio_plugins:/app/plugins
      - /dev/snd:/dev/snd:rw  # 音频设备访问
    devices:
      - /dev/snd:/dev/snd
    privileged: true  # 需要访问音频设备
    networks:
      - audio_network
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web控制界面
  audio-web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: audio-processing-web
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - AUDIO_API_URL=http://audio-processing:8000
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "8080:8000"
    volumes:
      - ../static:/app/static:ro
      - audio_logs:/app/logs
    networks:
      - audio_network
    depends_on:
      - audio-processing
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: audio-processing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - audio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: audio-processing-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=audioprocessing
      - POSTGRES_USER=audiouser
      - POSTGRES_PASSWORD=audiopass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - audio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiouser -d audioprocessing"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: audio-processing-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl:ro
    networks:
      - audio_network
    depends_on:
      - audio-web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3





networks:
  audio_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # 应用数据
  audio_logs:
    driver: local
  audio_recordings:
    driver: local
  audio_plugins:
    driver: local
  
  # 数据库
  postgres_data:
    driver: local
  redis_data:
    driver: local
  

  
  # Web服务
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local