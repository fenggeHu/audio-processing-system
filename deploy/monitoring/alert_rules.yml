# Alert rules for Audio Processing System

groups:
  - name: audio_processing_alerts
    rules:
      # System health alerts
      - alert: AudioProcessingDown
        expr: up{job="audio-processing"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Audio Processing System is down"
          description: "Audio Processing System has been down for more than 30 seconds."
      
      - alert: WebInterfaceDown
        expr: up{job="audio-processing-web"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Web interface is down"
          description: "Audio Processing Web interface has been down for more than 1 minute."
      
      # Performance alerts
      - alert: HighAudioLatency
        expr: audio_processing_latency_ms > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High audio processing latency"
          description: "Audio processing latency is {{ $value }}ms, above the 50ms threshold."
      
      - alert: CriticalAudioLatency
        expr: audio_processing_latency_ms > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical audio processing latency"
          description: "Audio processing latency is {{ $value }}ms, above the critical 80ms threshold."
      
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"
      
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"
      
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} {{ $labels.mountpoint }}"
      
      # Audio quality alerts
      - alert: LowEchoSuppression
        expr: audio_processing_erle_db < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low echo suppression"
          description: "Echo Return Loss Enhancement (ERLE) is {{ $value }}dB, below the 15dB threshold."
      
      - alert: LowSignalToNoise
        expr: audio_processing_snr_db < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low signal-to-noise ratio"
          description: "Signal-to-noise ratio is {{ $value }}dB, below the 10dB threshold."
      
      - alert: AudioDeviceError
        expr: audio_processing_device_errors_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audio device error detected"
          description: "{{ $value }} audio device errors detected in the last minute."
      
      # Service dependency alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis is down"
          description: "Redis service has been down for more than 1 minute."
      
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL service has been down for more than 1 minute."
      
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nginx is down"
          description: "Nginx service has been down for more than 1 minute."
      
      # Application-specific alerts
      - alert: HighErrorRate
        expr: rate(audio_processing_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate"
          description: "Error rate is {{ $value }} errors per second over the last 5 minutes."
      
      - alert: ServiceRestartLoop
        expr: changes(process_start_time_seconds{job="audio-processing"}[10m]) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service restart loop detected"
          description: "Audio processing service has restarted {{ $value }} times in the last 10 minutes."
      
      - alert: ConfigurationError
        expr: audio_processing_config_errors_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Configuration error detected"
          description: "{{ $value }} configuration errors detected."
      
      # Network and connectivity alerts
      - alert: HighNetworkLatency
        expr: probe_duration_seconds{job="blackbox"} > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High network latency"
          description: "Network latency to {{ $labels.instance }} is {{ $value }}s"
      
      - alert: TooManyConnections
        expr: audio_processing_active_connections > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many active connections"
          description: "{{ $value }} active connections, above the normal threshold."

  - name: classroom_specific_alerts
    rules:
      # Classroom-specific alerts
      - alert: MicrophoneArrayFailure
        expr: audio_processing_active_microphones < audio_processing_total_microphones * 0.75
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Microphone array failure"
          description: "Only {{ $value }} out of {{ audio_processing_total_microphones }} microphones are active."
      
      - alert: SpeakerSystemFailure
        expr: audio_processing_speaker_errors_total > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Speaker system failure"
          description: "{{ $value }} speaker system errors detected."
      
      - alert: ClassroomAcousticIssue
        expr: audio_processing_reverberation_time_s > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Classroom acoustic issue"
          description: "Reverberation time is {{ $value }}s, above the recommended 1.5s for classrooms."
      
      - alert: BackgroundNoiseHigh
        expr: audio_processing_background_noise_db > -35
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High background noise"
          description: "Background noise level is {{ $value }}dB, above the -35dB threshold."