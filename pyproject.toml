[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-audio-system"
version = "1.0.0"
description = "Production-grade audio processing system for multimedia classroom environments"
authors = [
    {name = "Production Audio System Team", email = "team@audio-system.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Education",
]

dependencies = [
    # Core audio processing
    "PyAudio>=0.2.11",
    "webrtcvad>=2.0.10",
    "pyroomacoustics>=0.7.3",
    
    # Scientific computing
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    
    # Visualization and web interface
    "matplotlib>=3.6.0",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    
    # Configuration and utilities
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    
    # Logging and monitoring
    "structlog>=23.1.0",
    "psutil>=5.9.0",
    
    # Async support
    "asyncio-mqtt>=0.13.0",
    "aiofiles>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

embedded = [
    # Embedded system optimizations
    "cython>=3.0.0",
    "numba>=0.57.0",
    "memory-profiler>=0.61.0",
]

performance = [
    # Performance monitoring and profiling
    "py-spy>=0.3.14",
    "line-profiler>=4.1.0",
    "pympler>=0.9",
]

[project.urls]
Homepage = "https://github.com/audio-system/production-audio-system"
Documentation = "https://production-audio-system.readthedocs.io/"
Repository = "https://github.com/audio-system/production-audio-system.git"
Issues = "https://github.com/audio-system/production-audio-system/issues"

[project.scripts]
audio-system = "src.main:main"
audio-benchmark = "src.tools.benchmark:main"
audio-config = "src.tools.config:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.conf"]

# Development tools configuration
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "hardware: marks tests that require hardware",
    "embedded: marks tests for embedded systems",
    "asyncio: marks tests as async tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]